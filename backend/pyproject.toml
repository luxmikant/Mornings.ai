[project]
name = "agentic-pr-manager"
version = "0.1.0"
description = "Agentic Personal Relation Manager - Autonomous cultural greeting card generation agent"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Agentic PR Manager Team" }]

dependencies = [
    # ── Agent Framework ──
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",

    # ── MCP Server SDK ──
    "mcp[cli]>=1.0.0",

    # ── Web Framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # ── Database ──
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",

    # ── AWS ──
    "boto3>=1.35.0",
    "bedrock-agentcore>=0.1.0",

    # ── Policy Engine ──
    "cedarpy>=4.0.0",

    # ── Image Processing ──
    "pillow>=11.0.0",
    "rembg>=2.0.0",

    # ── Scheduling ──
    "apscheduler>=3.10.0",

    # ── Push Notifications ──
    "firebase-admin>=6.0.0",

    # ── Cache ──
    "redis>=5.0.0",

    # ── HTTP Client ──
    "httpx>=0.27.0",

    # ── Auth ──
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # ── Utilities ──
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
