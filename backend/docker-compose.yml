# Agentic PR Manager — Local Development Stack
# Usage: docker compose up -d

services:
  # ── PostgreSQL with pgvector ────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: apr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentic_pr_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seeds/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis Cache ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: apr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
